version: 2.1

orbs:
  php: circleci/php@1.0
  node: circleci/node@5.0
  wp-svn: studiopress/wp-svn@0.2

executors:
  node-only:
    docker:
      - image: cimg/node:lts

jobs:
  zip:
    docker:
      - image: alpine:latest
    working_directory: ~/genesis-simple-hooks
    steps:
      - checkout
      - run:
          name: "Bundle plugin files into zips"
          command: |
            apk add --no-cache zip

            mkdir -p /tmp/artifacts/wp.org /tmp/artifacts/wpe

            BUILD_VERSION=`grep 'Version:' plugin.php | cut -f4 -d' '`
            FILENAME_ZIP=genesis-simple-hooks.$BUILD_VERSION.zip

            cd ~

            # Create wp.org version
            sed "s/^[^*]/*&/g" genesis-simple-hooks/.svnignore | sed "s/[^*]$/&*/g" | xargs zip -r "/tmp/artifacts/wp.org/$FILENAME_ZIP" genesis-simple-hooks -x

            # Create wpe version
            cp genesis-simple-hooks/scripts/class-genesis-simple-hooks-plugin-updater.php genesis-simple-hooks/includes/class-genesis-simple-hooks-plugin-updater.php
            sed "s/^[^*]/*&/g" genesis-simple-hooks/.svnignore | sed "s/[^*]$/&*/g" | xargs zip -r "/tmp/artifacts/wpe/$FILENAME_ZIP" genesis-simple-hooks -x
            rm -f genesis-simple-hooks/includes/class-genesis-simple-hooks-plugin-updater.php
      - store_artifacts:
          path: /tmp/artifacts/

  create_info_json:
    executor: node-only
    steps:
      - checkout
      - node/install-packages
      - run:
          name: "Create info.json for WPE"
          command: npm run zip:wpe:info
      - store_artifacts:
          path: build/wpe/info.json
          destination: info.json

  svn_deploy_tag:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout:
          path: genesis-simple-hooks
      - wp-svn/deploy-plugin:
          plugin-path: genesis-simple-hooks

workflows:
  test-deploy:
    jobs:
      - php/test:
          test-command: phpcs
      - zip:
          filters:
            tags:
              only: /.*/
          requires:
            - php/test
      - create_info_json:
          filters:
            tags:
              only: /.*/
          requires:
            - zip
      - wp-svn/check-versions:
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              only: /^release\/.*/
      - svn_deploy_tag:
          context: genesis-svn
          requires:
            - zip
            - wp-svn/check-versions
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - approval-for-deploy-tested-up-to-bump:
          requires:
            - php/test
          type: approval
          filters:
            tags:
              ignore: /.*/
            branches:
              only: /^bump-tested-up-to.*/
      - wp-svn/deploy-tested-up-to-bump:
          context: genesis-svn
          requires:
            - approval-for-deploy-tested-up-to-bump
